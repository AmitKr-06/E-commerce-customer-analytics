[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "e_commerce_customer_analytics"
version = "0.0.1"
description = "E-Commerce Customer Analytics \u0026 Revenue Intelligence"
authors = [
  { name = "Amit Kumar" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["e_commerce_customer_analytics"]
include = ["pyproject.toml", "e_commerce_customer_analytics/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["e_commerce_customer_analytics"]
force-sort-within-sections = true

